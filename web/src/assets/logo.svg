<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Main Pin Vertical Gradient: Coral-Red to Deep Crimson -->
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="40%" stop-color="#DC2626" />
      <stop offset="75%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Compass Arrow Left Facet (Light/Vibrant) -->
    <linearGradient id="needleLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="60%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <!-- Compass Arrow Right Facet (Deep Crimson Shadow) -->
    <linearGradient id="needleDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Subtle Soft Drop Shadow for Ground Anchor -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#881337" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#881337" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#881337" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ground Contact Shadow -->
  <ellipse cx="256" cy="482" rx="76" ry="14" fill="url(#groundShadow)" />

  <!-- Outer Map Location Pin -->
  <path
    d="M 256 470
       C 220 398 116 268 116 182
       A 140 140 0 1 1 396 182
       C 396 268 292 398 256 470
       Z"
    fill="url(#pinGradient)"
  />

  <!-- Top Bulb Subtle Gloss Highlight -->
  <path
    d="M 148 144
       C 174 92 212 66 256 66
       C 300 66 338 92 364 144
       C 334 104 298 84 256 84
       C 214 84 178 104 148 144
       Z"
    fill="#FFFFFF"
    opacity="0.18"
  />

  <!-- Center Core: Pure Solid White Circle Cutout -->
  <circle cx="256" cy="182" r="68" fill="#FFFFFF" />

  <!-- Inner Compass Needle Group (Centered at 256, 182 and rotated 45° to Upper-Right) -->
  <g transform="rotate(45, 256, 182)">
    <!-- Left Facet (Illuminated Red) -->
    <path
      d="M 256 134
         L 224 216
         L 256 196
         Z"
      fill="url(#needleLight)"
    />

    <!-- Right Facet (Deep Crimson Shadow) -->
    <path
      d="M 256 134
         L 256 196
         L 288 216
         Z"
      fill="url(#needleDark)"
    />

    <!-- Central Facet Seam Line -->
    <line
      x1="256"
      y1="134"
      x2="256"
      y2="196"
      stroke="#FFFFFF"
      stroke-width="1.25"
      stroke-linecap="round"
      opacity="0.45"
    />
  </g>
</svg>
